[package]
name = "rusternetes-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
sqlite = ["dep:rhino"]
redis = ["dep:rhino"]

[dependencies]
rusternetes-common = { path = "../common" }
# morero/rhino, a fork, not upstreamed to calfonso/rhino: its SQLite driver
# wrote a key's revision row and the `kine_current` pointer to it as two
# unsynchronised statements, so a late pointer write could move a key
# backwards and leave it permanently unwritable. See ISSUES.md #79.
rhino = { git = "https://github.com/morero/rhino", branch = "platform-ertia-fixes", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
etcd-client.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
